on: [push]
jobs:
  build:
    runs-on: talaryon-dotnet
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
            BRANCH=${GITHUB_REF#refs/heads/}
            VERSION="${LATEST_TAG#v}-ci.${GITHUB_SHA:0:8}"
            if [ "$BRANCH" != "main" ]; then
              VERSION="${VERSION}-${BRANCH}"
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Add NuGet source
        run: |
          dotnet nuget add source --name nuget.pkg.talaryon.dev https://nuget.pkg.talaryon.dev/v3/index.json
          dotnet nuget add source --name code.talaryon.dev \
            --username ${{ secrets.NUGET_USERNAME }} \
            --password ${{ secrets.NUGET_PASSWORD }} \
            --store-password-in-clear-text \
          https://code.talaryon.dev/api/packages/${{ forgejo.repository_owner }}/nuget/index.json

      - name: Publish project
        run: |
          dotnet publish src/StackManager.Proxy/StackManager.Proxy.csproj \
            -c Release \
            -o ./publish \
            -p:Version=${{ env.VERSION }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-publish
          path: ./publish

  push:
    needs: build
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: proxy-publish
          path: ./publish

      - name: Login to Container Registry
        run: |
          echo "${{ secrets.CONTAINER_REGISTRY_PASSWORD }}" | docker login code.talaryon.dev \
            --username ${{ secrets.CONTAINER_REGISTRY_USERNAME }} \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t code.talaryon.dev/${{ forgejo.repository_owner }}/stackmanager-proxy:${{ needs.build.outputs.version }} \
            -t code.talaryon.dev/${{ forgejo.repository_owner }}/stackmanager-proxy:latest \
            -f src/StackManager.Proxy/Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push code.talaryon.dev/${{ forgejo.repository_owner }}/stackmanager-proxy:${{ needs.build.outputs.version }}
          docker push code.talaryon.dev/${{ forgejo.repository_owner }}/stackmanager-proxy:latest
