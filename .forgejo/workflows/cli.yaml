on:
  push:
    paths:
      - 'src/StackManager.CLI/**'
      - 'src/StackManager.Shared/**'
jobs:
  build-and-pack:
    runs-on: talaryon-dotnet
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
            BRANCH=${GITHUB_REF#refs/heads/}
            VERSION="${LATEST_TAG#v}-ci.${GITHUB_SHA:0:8}"
            if [ "$BRANCH" != "main" ]; then
              VERSION="${VERSION}-${BRANCH}"
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Add NuGet source
        run: | 
          dotnet nuget add source --name nuget.pkg.talaryon.dev https://nuget.pkg.talaryon.dev/v3/index.json
          dotnet nuget add source --name code.talaryon.dev \
            --username ${{ secrets.NUGET_USERNAME }} \
            --password ${{ secrets.NUGET_PASSWORD }} \
            --store-password-in-clear-text \
          https://code.talaryon.dev/api/packages/${{ forgejo.repository_owner }}/nuget/index.json

      - name: Build NuGet package
        run: dotnet pack src/StackManager.CLI/StackManager.CLI.csproj -c Release -o ./artifacts/cli -p:Version=${{ env.VERSION }}

      - name: Push NuGet package
        run: dotnet nuget push ./artifacts/cli/Talaryon.StackManager.${{ env.VERSION }}.nupkg -s code.talaryon.dev -k ${{ secrets.NUGET_PASSWORD }}