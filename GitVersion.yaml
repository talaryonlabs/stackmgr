mode: ContinuousDelivery
branches:
  main:
    label: ''
    regex: ^main$
    increment: Patch
    prevent-increment-of-merged-branch-version: false
    is-main-branch: true
  develop:
    label: 'dev'
    regex: ^dev$
    increment: Patch
    source-branches: [ main ]
    is-develop: true
  feature:
    label: feature
    increment: Inherit
    regex: ^feature?[/-]
    source-branches: [ main, develop ]