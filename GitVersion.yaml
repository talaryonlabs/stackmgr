mode: ContinuousDelivery
branches:
  main:
    label: ''
    regex: ^main$
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    commit-message-incrementing: MergeMessageOnly
    is-main-branch: true
  develop:
    label: 'dev'
    regex: ^dev$
    increment: None
    source-branches: [ ]
    is-develop: true
  feature:
    label: feature
    increment: Inherit
    regex: ^feature?[/-]
    source-branches: [ main, develop ]